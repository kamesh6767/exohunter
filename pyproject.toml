[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exohunter"
version = "1.0.0"
description = "Automated Exoplanet Detection & Vetting Pipeline using Kepler & TESS Light Curves"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
exohunter = "cli:main"
